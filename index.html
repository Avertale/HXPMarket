<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HXPMarket | Knife VS Guns Duels Values</title>
    <style>
        :root {
            --bg-dark: #070707;
            --bg-card: #0f0f0f;
            --border-color: #1f1f1f;
            --accent-red: #8b0000;
            --accent-red-bright: #b22222;
            --accent-red-glow: rgba(139, 0, 0, 0.25);
            --text-main: #f0f0f0;
            --text-muted: #777777;
            --tier-godly: #ff2222;
            --tier-legendary: #ff8800;
            --tier-epic: #aa00ff;
            --tier-rare: #0088ff;
            --tier-common: #aaaaaa;
            --tag-unobtainable: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 2px solid var(--accent-red);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px var(--accent-red-glow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-icon {
            width: 20px;
            height: 20px;
            background-color: var(--accent-red-bright);
            transform: rotate(45deg);
            box-shadow: 0 0 12px var(--accent-red-bright);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        h1 span {
            color: var(--accent-red-bright);
        }

        .game-tag {
            font-size: 0.8rem;
            background: rgba(139, 0, 0, 0.15);
            color: var(--accent-red-bright);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--accent-red);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        main {
            flex: 1;
            padding: 2.5rem 2rem;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
        }

        .hero-section {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hero-title h2 {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .hero-title p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-bar {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 300px;
            transition: border-color 0.2s;
        }

        .search-bar:focus-within {
            border-color: var(--accent-red);
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: rgba(0,0,0,0.3);
        }

        tr:hover td {
            background-color: rgba(139, 0, 0, 0.04);
        }

        .item-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .unobtainable-tag {
            font-size: 0.65rem;
            background: rgba(255, 51, 51, 0.15);
            color: var(--tag-unobtainable);
            border: 1px solid rgba(255, 51, 51, 0.4);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .item-type {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-godly { background: rgba(255, 34, 34, 0.15); color: var(--tier-godly); border: 1px solid rgba(255, 34, 34, 0.3); }
        .badge-legendary { background: rgba(255, 136, 0, 0.15); color: var(--tier-legendary); border: 1px solid rgba(255, 136, 0, 0.3); }
        .badge-epic { background: rgba(170, 0, 255, 0.15); color: var(--tier-epic); border: 1px solid rgba(170, 0, 255, 0.3); }
        .badge-rare { background: rgba(0, 136, 255, 0.15); color: var(--tier-rare); border: 1px solid rgba(0, 136, 255, 0.3); }
        .badge-common { background: rgba(170, 170, 170, 0.15); color: var(--tier-common); border: 1px solid rgba(170, 170, 170, 0.3); }

        .value-col {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .demand-high { color: #00ff66; font-weight: 600; }
        .demand-stable { color: #cccccc; font-weight: 600; }
        .demand-low { color: #ff3333; font-weight: 600; }

        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"></div>
            <h1>HXP<span>Market</span></h1>
        </div>
        <div class="game-tag">Knife VS Guns Duels Values</div>
    </header>

    <main>
        <div class="hero-section">
            <div class="hero-title">
                <h2>Weapon Value List</h2>
                <p>Complete weapon database tracking rarities, trade values, and unobtainable legacy items.</p>
            </div>
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Search weapon..." onkeyup="filterItems()">
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Weapon Name</th>
                        <th>Type</th>
                        <th>Rarity</th>
                        <th>Value</th>
                        <th>Demand</th>
                        <th>Trend</th>
                    </tr>
                </thead>
                <tbody id="valueTableBody">
                    <!-- Populated dynamically via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        &copy; 2026 HXPMarket. Not affiliated with Roblox Corporation. Values update dynamically.
    </footer>

    <script>
        const itemDatabase = [
            { name: "Bloodreign Blade", type: "Knife", rarity: "Godly", value: 4500, demand: "High", trend: "📈 Rising", unobtainable: false },
            { name: "Void-Caller Revolver", type: "Gun", rarity: "Godly", value: 3800, demand: "High", trend: "📈 Rising", unobtainable: false },
            { name: "Crimson Phantom", type: "Knife", rarity: "Godly", value: 2900, demand: "Stable", trend: "➖ Stable", unobtainable: true },
            { name: "Shadowstrike Carbine", type: "Gun", rarity: "Legendary", value: 1450, demand: "Stable", trend: "➖ Stable", unobtainable: false },
            { name: "Obsidian Dagger", type: "Knife", rarity: "Legendary", value: 950, demand: "Low", trend: "📉 Dropping", unobtainable: true },
            { name: "Neon Reaper", type: "Knife", rarity: "Godly", value: 5200, demand: "High", trend: "📈 Rising", unobtainable: false },
            { name: "Eclipse Blaster", type: "Gun", rarity: "Legendary", value: 1100, demand: "Stable", trend: "➖ Stable", unobtainable: false },
            { name: "Bloodlust Shiv", type: "Knife", rarity: "Epic", value: 350, demand: "Stable", trend: "➖ Stable", unobtainable: false },
            { name: "Toxic Enforcer", type: "Gun", rarity: "Epic", value: 420, demand: "Low", trend: "📉 Dropping", unobtainable: true },
            { name: "Pixel Knife", type: "Knife", rarity: "Uncommon", value: 500000, demand: "High", trend: "📈 Rising", unobtainable: true },
            { name: "Yuletide Knife", type: "Knife", rarity: "Uncommon", value: 700000, demand: "High", trend: "📈 Rising", unobtainable: true },
            { name: "Shimmer Knife", type: "Knife", rarity: "Common", value: 25, demand: "Low", trend: "➖ Stable", unobtainable: false },
            { name: "Chrome Gun", type: "Gun", rarity: "Common", value: 20, demand: "Low", trend: "➖ Stable", unobtainable: false },
            { name: "Standard Tactical", type: "Knife", rarity: "Rare", value: 50, demand: "Stable", trend: "➖ Stable", unobtainable: false }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('valueTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 2rem;">No matching items found.</td></tr>`;
                return;
            }

            data.forEach(item => {
                let badgeClass = 'badge-common';
                if (item.rarity === 'Godly') badgeClass = 'badge-godly';
                else if (item.rarity === 'Legendary') badgeClass = 'badge-legendary';
                else if (item.rarity === 'Epic') badgeClass = 'badge-epic';
                else if (item.rarity === 'Rare') badgeClass = 'badge-rare';
                else if (item.rarity === 'Uncommon') badgeClass = 'badge-epic';

                let demandClass = 'demand-stable';
                if (item.demand === 'High') demandClass = 'demand-high';
                else if (item.demand === 'Low') demandClass = 'demand-low';

                const unobtainableHTML = item.unobtainable ? `<span class="unobtainable-tag">UNOBTAINABLE</span>` : '';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="item-container">
                            <span class="item-name">${item.name}</span>
                            ${unobtainableHTML}
                        </div>
                    </td>
                    <td><div class="item-type">${item.type}</div></td>
                    <td><span class="badge ${badgeClass}">${item.rarity}</span></td>
                    <td class="value-col">💎 ${item.value.toLocaleString()}</td>
                    <td><span class="${demandClass}">${item.demand}</span></td>
                    <td>${item.trend}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = itemDatabase.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.type.toLowerCase().includes(query) || 
                item.rarity.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        window.onload = () => {
            renderTable(itemDatabase);
        };
    </script>
</body>
</html>
